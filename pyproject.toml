[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blackmamba-cognitive"
version = "0.0.1"
description = "Executable cognitive runtime for the BlackMamba architecture"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
watcher = "blackmamba_cognitive.watcher:main"
brain = "blackmamba_cognitive.brain:main"
define = "blackmamba_cognitive.define:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
